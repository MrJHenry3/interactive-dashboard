<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    
    <!--Link CSS stylesheet-->
    <link rel="stylesheet" href="css/style.css">

    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</head>
<body>
        
        <h1> My Interactive Dashboard</h1>
        
	<p>This dashboard was created by Joseph Henry for the Web 115 course at Wake Tech.</p>

        <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive 	websites.");</script>

        <noscript> Unfortunately, your web browser does not support JavaScript
	</noscript>
            
        

        <div class="container">
            <div class="row">

	    <div class="col" id="magic-eight-ball">
     		<script src="magic-eight-ball.js" defer></script>
     		<link rel="stylesheet" href="css/magic-eight-ball.css">

     		<h2 class="heading">Magic Eight Ball</h2>

      		<form>

       			<p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>

       			<input id="question" name="question" size="80">

       			<div id="magicEightBall">

        			<div id="circle"></div>
        			<img id="ball" src="img/magic-eight-ball.png"/>
       			</div>
       			<button id="reset" name="reset" type="reset">Ask another question</button>
      		</form>
      		<br>
   	    </div>

            <div class="col" id="metric-converter">
                    <form>
                        <label>Enter a value: 
                            <input id="value1" type="text">
                        </label>
                        
                        <br><br>

                        <label>From Unit:
                            <select id="units1">
                                <option value="in">in</option>
                                <option value="ft">ft</option>
                                <option value="yd">yd</option>
                                <option value="mi">mi</option>
                                <option value="cm">cm</option>
                                <option value="m">m</option>
                                <option value="km">km</option>
                            </select>
                    </label>
                    
                    <br><br>
                 
                    <label>To Unit:
                        <select id="units2">
                            <option value="cm">cm</option>
                            <option value="m">m</option>
                            <option value="km">km</option>
                            <option value="in">in</option>
                            <option value="ft">ft</option>
                            <option value="yd">yd</option>
                            <option value="mi">mi</option>
                        </select>
                    </label>
                    
                    <br><br>

                    <button id="convert-button" type="submit">Convert</button>
                    <p id="result"></p>
                </form>
                    <script src="metric-converter.js"></script>
                    
                           
                </div>
            </div>
            
        </div>

                <!--Create form "weekly-tasks"-->
        <div class="col" id="weekly-tasks">

                <!--Link external JavaScript-->
                <script src="task-manager.js"></script>
            
                <!--Create form with 3 input fields (Name, Daily Task Goal, & Weekly Bonus Tasks)-->
                <form id = "task-form">
                    <div class=" form-group">
                        <label for="user-name">Name:</label>
                        <input type="text" id="user-name" name="userName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="daily-goal">Daily Task Goal:</label>
                        <input type="number" id="daily-goal" name="dailyGoal" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="weekly-bonus">Weekly Bonus Tasks:</label>
                        <input type="number" id="weekly-bonus" name="weeklyBonus" min="0" required>
                    </div>

                    <!--Add a button to the form with an ID of "goal-btn".-->
                    <button type="button" id="goal-btn">Submit</button>
                </form>

                <!--Add an Output Area-->
                <p id="goal-message"></p>

            </div>
        </div>
        
    </div>
       
</body>
</html>
